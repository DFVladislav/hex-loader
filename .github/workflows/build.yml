name: Build & Release Hex Loader

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: false

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev \
            xorg-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build -o hex-loader-linux-x64 .
        env:
          CGO_ENABLED: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hex-loader-linux-x64
          path: hex-loader-linux-x64
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: false

      - name: Install MSYS2 toolchain and GLFW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-glfw

      - name: Check formatting
        shell: pwsh
        run: |
          $gofmt = (Get-Command gofmt).Source
          & $gofmt -l .

      - name: Build
        shell: msys2 {0}
        run: |
          export CGO_ENABLED=1
          export CC=gcc
          export PKG_CONFIG=/ucrt64/bin/pkg-config
          go build -o hex-loader-windows-x64.exe .
        env:
          PATH: /ucrt64/bin:/usr/bin:$PATH

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hex-loader-windows-x64
          path: hex-loader-windows-x64.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build -o hex-loader-macos-arm64 .
        env:
          CGO_ENABLED: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hex-loader-macos-arm64
          path: hex-loader-macos-arm64
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: List artifacts
        run: find release-files -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
