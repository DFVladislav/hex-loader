name: Build & Release Hex Loader

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: hex-loader
            asset_name: hex-loader-linux-amd64
          - os: windows-latest
            artifact_name: hex-loader.exe
            asset_name: hex-loader-windows-amd64.exe
          - os: macos-latest
            artifact_name: hex-loader
            asset_name: hex-loader-macos-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev \
            xorg-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-x11-dev
