name: Build & Release Hex Loader

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: false

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev \
            xorg-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev

      - name: Build
        run: go build -o hex-loader-linux-x64 .
        env:
          CGO_ENABLED: 1

      - uses: actions/upload-artifact@v4
        with:
          name: hex-loader-linux-x64
          path: hex-loader-linux-x64
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-go

      - name: Build
        shell: msys2 {0}
        run: |
          export CGO_ENABLED=1
          export CC=gcc
          go build -o hex-loader-windows-x64.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: hex-loader-windows-x64.exe
          path: hex-loader-windows-x64.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: false

      - name: Build
        run: go build -o hex-loader-macos-arm64 .
        env:
          CGO_ENABLED: 1

      - uses: actions/upload-artifact@v4
        with:
          name: hex-loader-macos-arm64
          path: hex-loader-macos-arm64
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List files
        run: ls -la release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
